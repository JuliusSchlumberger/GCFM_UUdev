# Portable conda environment: direct dependencies, major.minor pins.
# Exact Windows reproduction: environment.win-64.lock.yml.
name: gcfm
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # workflow
  - snakemake=9.21
  - hydromt=1.3
  - numpy=2.4
  - pandas=2.3
  - xarray=2026.4
  - dask=2026.3
  - scipy=1.17
  - geopandas=1.1
  - shapely=2.1
  - pyogrio=0.12
  - pyproj=3.7
  - rasterio=1.4
  - rioxarray=0.19
  - affine=2.4
  - netcdf4=1.7
  - openpyxl=3.1
  - pyyaml=6.0
  - pyextremes=2.5
  - lmoments3=1.0
  - pymannkendall=1.4
  - boule=0.6
  # figures and tools
  - matplotlib=3.10
  - cartopy=0.25
  - ffmpeg=8.0
  - graphviz=14.1
  - requests=2.33
  # development
  - pytest=9.0
  - pre-commit=4.6
  - pip
  - pip:
      - hydromt-sfincs==2.0.0rc2
      - pyshtools==4.14.*
      - cdsapi==0.7.*
      - line-profiler==5.0.*
