name: CI

# What this can and can't check:
# `snakemake -n` needs every data_catalogue.yml-referenced raw file to exist
# on disk to build the DAG (raw_data/ is multi-GB and lives outside the repo
# -- see config/data_catalogue.yml's `root:`), so that's not available to a
# CI runner and this workflow does NOT attempt a dry-run. What it *does*
# check, without needing any data:
#   - formatting / lint / docstrings, via the same pre-commit hooks used
#     locally (ruff-format, ruff-check, pyright, pydocstyle)
# The sync-environment-lock local hook is SKIPPED here: it shells out to
# `conda env export` for the env named in environment.win-64.lock.yml, which
# only makes sense on a dev's own machine where that env exists -- this runner
# has no conda at all (see tools/sync_environment.py).
#
# Unit tests: the synthetic-data pytest suite under tests/unit (no raw data,
# no conda environment) runs in its own job with a pip-installed minimum set
# of packages -- see the unit-tests job below.
#
# There is NO code-health/import-check job here: it needs the full pipeline
# environment (the portable environment.yml; environment.win-64.lock.yml is
# Windows-only), which is slow to build on every PR. Run
# `python tests/check_code_health.py` locally (see CONTRIBUTING.md).
# Before merging, also actually dry-run `snakemake -n preprocess`/`build`
# locally against real data -- see CONTRIBUTING.md's PR checklist.
#
# Deliberately triggers on pull_request only, not push: triggering on both
# for the same branch makes each job name show up twice (once per event
# type) in the branch-protection "required status checks" picker, since
# GitHub tracks pull_request-triggered and push-triggered runs of the same
# job as distinct check contexts even though the name is identical.

on:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: sync-environment-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every third-party package tests/unit imports at module level, directly
      # or through src; keep in sync (see CLAUDE.md). A pip list is faster
      # than building the conda env from environment.yml.
      - run: pip install pytest numpy pandas xarray geopandas pyogrio shapely rasterio pyproj rioxarray scipy matplotlib "pyextremes[lmoments]" pymannkendall netCDF4 pyyaml openpyxl "hydromt-sfincs==2.0.0rc2"
      - run: pytest
