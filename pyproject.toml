[tool.pydocstyle]
convention = "google"
add_ignore = "D100,D102,D103,D107,D200,D202,D205,D212,D213,D415,D417"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff defaults (E4, E7, E9, F) plus import sorting and pyupgrade
extend-select = ["I", "UP"]

[tool.pyright]
typeCheckingMode = "off"
exclude = [
    "analyze_dem_coverage.py",
    "_diag_river.py",
    "_diag_river2.py",
    "download_glofas.py",
    "plot_dag.py",
]

[tool.pytest.ini_options]
# Only the synthetic unit tests: the other scripts under tests/ are stand-alone
# analysis/plotting scripts that need real pipeline results, not pytest tests.
testpaths = ["tests/unit"]
addopts = "-m 'not needs_data'"
markers = [
    "needs_data: needs raw data or pipeline results (GCFM_RAW_DATA_ROOT / GCFM_RESULTS_DIR); run with -m needs_data",
]
