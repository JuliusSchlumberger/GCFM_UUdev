data_catalogue: ./config/data_catalogue.yml
scenarios_file: ./config/scenarios.yml

profiling:
  enabled: false   # set to true to write line-level timing reports next to each log file

results_dir: D:/GCFM_UU/results

# ── Domain & basin setup (rules 01-02) ───────────────────────────────────────
domain:
  delta_buffer_m: 2000   # clipping bbox buffer around the delta polygon (m)

# ── Shared vertical datum correction ─────────────────────────────────────────
datum_correction: # EGM2008 -> GOCO06s (DEM) or local MSL -> GOCO06s (bathymetry), surge
  mdt_load_margin_deg: 5.0       # margin (degrees) beyond domain bbox when loading MDT
  fallback_search_deg: 3.0       # +/- deg to search for a valid MDT cell if the nearest station

# ── Terrain / bathymetry merge (rule 05a) ────────────────────────────────────
terrain:
  gebco_max_depth_m: 7.0  # clamp GEBCO depths. SFINCS's internal time step is set by
                          # a CFL condition (dt ~ dx/sqrt(g*h)) and shared by
                          # the WHOLE domain via its single deepest active
                          # cell.

# ── Existing flood-protection levels (rule 04) ───────────────────────────────
flopros_range:
  default_rp_yr: 2.0    # fallback assumed protection RP when neither Riverine nor Coastal are given
  max_rp_yr: 1000.0     # cap on the (FLOPROS) protection RP before discharge/

# ── River network processing (rules 06, 08, 09, 10) ──────────────────────────
river_processing:
  depth_method: "modelled" # "modelled" (run SFINCS to measure depth & dike crest) or "empirical" (formula-driven from discharge)
  flow_accumulation:
    discharge_variable: bankfull_discharge
    iterations: 100
  river_depth_modelling:  # rule modelled_depth_estimation (10), only used when depth_method == "modelled"
    calibration_days: 1             # single fixed run duration (days)
    discharge_ramp_hours: 6.0        # linear ramp from each crossing's own bankfull_discharge up to the full calibration discharge over this many hours (from t=0), then held flat for the rest of the run -- avoids forcing the full (often many-times-bankfull) calibration discharge as an instantaneous step into an initially near-dry channel, which produces a startup shock wave that can persist/oscillate for the whole run instead of damping out. Mirrors production's own bankfull-lead-in-then-ramp hydrograph shape (src.river_forcing.build_design_discharge_matrix/sinusoidal_wave, rule 13/14's own spin-up), just linear instead of sinusoidal since calibration only needs to reach and hold the peak, not simulate a full event recession.
    weir_crest_m: 1000.0            # initial channel-confinement weir crest (m) -- effectively never overtopped
    weir_crest_fraction: 0.2        # ROUND 0 ONLY, applied UNIFORMLY to every cell with no magnitude threshold: fraction of the isolated-confinement rise above DEM (period_max_zs - dem_at_point) assigned to the production riverbank weir's crest; the remainder (1 - this) becomes channel excavation depth (rivdph) -- this initial depth/crest split is never revisited again; correction rounds only ever adjust the crest (see freeboard_m below). The mouth reach's own separate 2-anchor bed interpolation (see 10_depth_estimation_modelled.py) is what keeps its interior cells smooth.
    n_correction_iterations: 10      # MAXIMUM number of additional coupled-system correction rounds after the initial isolated-confinement calibration (round 0) -- each builds a model with round 0's own (fixed, never revisited) excavation + the CURRENT calibrated crest, and raises the crest wherever the resulting water level leaves less than _CALIBRATION_FREEBOARD_M (a fixed 0.5 m, hardcoded in 10_depth_estimation_modelled.py -- NOT this section's own freeboard_m, see that key's own comment below) of margin below it. Corrects for backwater coupling between reaches that round 0's isolated-per-reach confinement can't see. 0 = round 0's own estimate used unchanged. Calibration STOPS EARLY, before reaching this maximum, once the crest already exceeds the period-max water level everywhere (no raw overtopping under that round's own simulation, centerline + coastal probes + river boundary probes) -- containment alone, checked directly against real overtopping, not against how much total area ends up flooded (a realized-inundated-cell-count-vs-round-0 stability check was removed 2026-08-06: round 0 is confined by an effectively un-overtoppable 1000 m wall, so its own flooded footprint is artificially tiny, and a real, correctly-contained crest can legitimately have a much larger but perfectly genuine and stable flooded footprint than that -- the check was overly protective and could block convergence indefinitely even with zero overtopping observed for many rounds running). That first convergence isn't the final round, though: the raise-only process above can leave real excess margin behind (it never lowers crest while any cell is still overtopped elsewhere), so this spends exactly ONE more round tightening every cell's crest down to period_max_zs + _CALIBRATION_FREEBOARD_M in one shot and re-simulating once to verify it still holds everywhere; if it doesn't, that whole snap is abandoned (not patched cell-by-cell) and the round before it becomes the converged one instead. Any remaining round slot(s) up to this maximum are then backfilled with the converged round's own files (no further SFINCS runtime spent on rounds that can't change the outcome).
    min_crest_increment_per_round_m: 2.5  # CORRECTION ROUNDS ONLY, overtopped cells (period_max_zs > weir_crest_current): minimum-step-size FLOOR (m) on the crest's own increment -- delta = max(period_max_zs - weir_crest_current, this), i.e. close the full gap if it's larger than this floor, otherwise overshoot on purpose by at least this much, so the crest keeps making real progress toward containment instead of stalling on a residual that never grows enough to matter. Where the cell is already contained (period_max_zs <= weir_crest_current), this floor does not apply at all.
    # ── weir-building params (used by modelled_depth_estimation every round)
    min_component_cells: 30           # discard small isolated land islands or water patches below this cell count on either side -- neither gets a weir ring around it
    weir_par1: 1.0                    # SFINCS weir discharge coefficient (Cd in Q = Cd*L*head^1.5) -- scales overtopping discharge directly; lower = more throttled flow for the same exceedance
    freeboard_m: 0.0                  # REAL PRODUCTION top-up only (2026-08-05 fix): added once, uniformly, on the FINAL exported weir in 10_depth_estimation_modelled.py, on top of whatever the calibration's own internal convergence (fixed at _CALIBRATION_FREEBOARD_M=0.5, NOT this value) already converged to. Previously this config value was silently a no-op in production -- the final weir trace always passed freeboard_m=0.0 regardless of this setting, since it assumed the margin was already baked in by this same value during calibration. Now genuinely controls how much extra safety margin ends up in the built model.
    river_crest_dilation_cells: 5     # FLOOR only, not the actual value used -- modelled_depth_estimation (every round) computes the real dilation radius as max(this floor, river_width_m / (2 * coarse_grid_resolution_m)) per basin, tying it to a physically meaningful scale (a wide river's calibrated crest needs to reach further onto adjacent land than a narrow one does) instead of one arbitrary constant for every basin. This value is the minimum below which that formula never goes.
  empirical_estimation: # only used when depth_method == "empirical" (rule empirical_depth_estimation, 10); ignored entirely under depth_method == "modelled"
    modify_hydrograph: false # Toggle to include flopras protection
    hydraulic_geometry: # Bankfull depth using the downstream hydraulic geometry power-law relation (Leopold & Maddock, 1953, and successors), depth = c*Q^f
      c: 0.27   # depth coefficient
      f: 0.30   # depth exponent
    estuarine_depth: # part of rule empirical_depth_estimation (10); not applied when depth_method == "modelled". Applying Leuven et al. (2018) for estuarine reaches
      enabled: true
      max_match_dist_km: 300.0  # max distance from basin bbox to Nienhuis delta lat/lon
      obrien_C: 6.5e-4          # O'Brien (1969) coefficient: A0 = C * P^alpha [m^3]
      obrien_alpha: 0.85        # O'Brien exponent (0.85 for natural, mixed-energy estuaries)
      convergence_ratio_k: 2.5  # L_A = L_e / k (convergence length as fraction of estuary length)
      blend_fraction: 0.15      # linear blend over +-15% of L_e around the estuarine/fluvial boundary
      min_depth_m: 0.5          # floor on estuarine reach depth

# ── Boundary forcings (rule 07) ─────────────────────────────────────────────
boundary_forcings:
  lead_days: 1
  dt_hr: 1
  surge:
    min_stations: 6
    max_stations: 10
    dedupe_radius_km: 1
    search_radii_km: [10, 25, 50, 1000]
    period_hr: 12
    slr: # IPCC AR6 sea-level-rise fingerprint, scaled to a single global-mean target (slr_m) and added to each station's storm-tide level. slr_m is deliberately applied at scenario-build time (rule build_sfincs), not baked into surge_forcing.nc (rule get_boundary_forcings) -- so changing slr_m only reruns the per-scenario build + event run, never the basin-level weir/depth calibration or skeleton build (which only ever see the MDT-only baseline). See src.surge.apply_slr_fingerprint / build_design_surge_matrix.
      enabled: true
      slr_m: 0.3                 # target global-mean SLR (m); 0 = no SLR added; applied downstream, not by rule get_boundary_forcings itself
      ssp_scenario: ssp245
      confidence_level: medium   # "medium" or "low"
      year: 2100
      quantile: 0.5
      fallback_search_deg: 3.0   # +/- deg to search for a valid AR6 location if the nearest is NaN
  river:
    period_hr: 24 # Choice of discharge variable from GLOFAS used.
    discharge_multiplier: 1.0 # Uniform scaling factor on the built discharge hydrograph at every active river seed/boundary crossing; 1.0 = no-op. Applied at scenario-build time (rule build_sfincs, src.river_forcing.build_design_discharge_matrix), NOT baked into river_forcing.nc -- so changing it only reruns the per-scenario build + event run, never rule get_boundary_forcings or the weir/depth calibration (rule 10, which also reads river_forcing.nc but for its own separate calibration seed discharge, unaffected by this factor by design -- mirrors surge.slr.slr_m's deferred application).
    glofas_buffer_deg: 1.0
    glofas_search_radius_km: 5.0    # radius around inside-domain reach centroid to search for GloFAS cells
    glofas_min_mean_discharge: 10.0  # minimum mean discharge (m³/s) for a GloFAS cell to be considered

    eva:  # Extreme value analysis on GloFAS discharge -- river-only
      rp_fl: 100.0          # diagnostic-only preview return period (yr) for rule get_boundary_forcings' own q_rp100/CI/plot-vertical-line and the has_glofas "ok" gate -- a fixed, basin-level constant, NOT derived from any requested scenario's own river_rp (a scenario-derived value here previously made this basin-level rule's own output -- and therefore everything downstream, including the expensive depth calibration -- rerun on every scenario switch, and even made has_glofas itself vary depending on which scenario happened to be requested first). The actual production discharge_rp_table (rules 08/10/13) is always computed at every standard RP regardless of this value.
      rp_bf: 1.5            # return period for bankfull discharge (yr, AMAX/GEV fit)
      ci_alpha: 0.95
      threshold_start_pct: 90.0
      threshold_step_pct: 1.0
      threshold_min_pct: 50.0   # floor: never drop below this percentile
      threshold_max_pct: 99.5
      threshold_max_iter: 30    # enough to traverse 50→99.5 % at 1 % steps
      peaks_per_year_min: 1.0
      peaks_per_year_max: 5
      min_years_high_confidence: 40
      min_days: 9131       # minimum valid days to attempt EVA (≈25 yr)
      decorr_cut: 0.368    # autocorrelation cutoff (≈1/e) for decorrelation window
      decorr_max: 30       # maximum decorrelation lag to search (days)
      fit_method: Lmoments

    bias_correction: # GRDC bias correction of GloFAS
      enabled: false            # set to false to disable GRDC bias correction globally
      # Also used whenever GRDC is consulted at all, not just when the
      # correction itself is applied: the raw GloFAS-vs-GRDC correlation
      # diagnostic (compute_grdc_correlation) runs unconditionally,
      # independent of `enabled` -- see src.extreme_values module docstring.
      grdc_search_radius_km: 15.0  # radius around inside-domain reach centroid to search
                                    # for a nearby GRDC gauge station (gauges are sparse,
                                    # hence a larger radius than glofas_search_radius_km)
      min_overlap_days: 730    # minimum overlapping valid days (GloFAS & GRDC) required
                                # to attempt empirical quantile mapping (~2 yr); else skipped
      tail_percentile: 90.0    # the headline GloFAS-vs-GRDC correlation is restricted to overlap days where
                                # GRDC discharge is at or above this percentile.

# ── Testing / validation (rule 11) ───────────────────────────────────────────
testing: # Diagnostic-only side branch
  upstream_boundary_check:
    effective_period_fraction: 0.5   # fraction of surge period_hr used as effective tidal period
    channel_manning_n: 0.030            # assumed channel roughness
    amplitude_threshold_fraction: 0.05   # march upstream until amplitude decays
                                          # below this fraction of its LOCAL
                                          # (per-mouth) starting value
    surge_rp: 100                        # surge return period (yr) used as the per-mouth wave
                                          # amplitude (A0) for this check -- independent of any
                                          # scenario's own design RP. Must be a COAST-RP tabulated
                                          # value: 1,2,5,10,25,50,100,250,500,1000.

# ── SFINCS model build & run (rules 13, 14, 15) ─────────────────────────────
sfincs:
  boundary_setup: # rule 13
    waterlevel_buffer_m: 25000   # search radius for matching surge boundary stations to the
                                  # nearest waterlevel boundary cell (m)
    outflow_buffer_m: 500.0      # buffer radius (m) around each delta-outline outflow point
    # mode/design_rp_river_yr/design_rp_surge_yr are no longer set here --
    # derived per-scenario from config/scenarios.yml (see scenario_params in
    # 00_common.smk): both RPs set -> compound; exactly one set -> that
    # driver alone (river_only/coastal_only); both null -> invalid.
    flat_boundary_point_spacing_m: 5000   # boundary-point spacing along the waterlevel mask, used only when mode="river_only"
    compound:
      lag_hr: 0 # Shifts the river discharge timeseries relative to the surge timeseries
  grid:
    optimize_resolution:  # rule 08b: per-basin resolution based on river width + domain cell budget
      enabled: true
      default_resolution_m: 200.0        # preferred target used when enabled: false (still subject to the cell-budget cap below)
      target_cells_per_width: 3.0        # when enabled: candidate = width_p20 (20th-percentile channel width among discharge-thresholded reaches) / this factor
      max_active_cells: 4_000_000          # cell-budget cap (analytic: polygon_area / resolution^2), applies unconditionally
    active_mask:  # rule modelled_depth_estimation (10)/13: exclude cells far above anything the river itself ever reaches
      enabled: true
      elevation_buffer_m: 20.0  # active-cell elevation ceiling = river_elevation_max.json's own
                                 # river_elevation_max_m (rule enforce_river_monotonicity, 09, max conditioned centerline
                                 # elevation, always attained at a seed reach) + this buffer
  subgrid:
    enabled: true                # set to false to skip subgrid
    nr_subgrid_pixels: 10        # subgrid pixels per grid cell (must be multiple of 2)
    nr_levels: 20                 # water-level bins for subgrid tables; memory scales linearly with this (default: 20)
    nrmax: 2000                  # tile size for subgrid computation (default 2000)
  observation_points:
    n_top_crossings: 2           # number of highest-Q boundary crossings to trace downstream
    n_per_crossing: 5            # observation points placed per crossing
    max_downstream_hops: 200     # river-network traversal limit per crossing

  simulation: # Main EVENT model config
    tref: "2000-01-01 00:00:00"  # reference datetime; forcing timeseries are in "hours since tref"
    dtmapout:     3600           # spatial map output interval (s) -- MAIN EVENT run only
    dtmaxout:     3600           # max-value envelope output interval (s)
    dthisout:      600           # time-series output at observation points (s) -- MAIN EVENT run only
    storevelmax:     0           # write maximum flow velocity (0=off, 1=on)
    storetwet:       0           # write inundation duration / time-wet (0=off, 1=on)
    sfincs_exe: C:/Users/Schlu005\GCFM_UU\delta_model\software\SFINCS_v2.3.0_mt_Faber_release_exe\sfincs.exe
    timeout_s: 68400             # max wall-clock time for a SFINCS subprocess (s, 19 h) --
                                  # shared by both the spin-up and main event runs
  spinup: # Spin-up simulation with constant forcings
    enabled: true                # run a spin-up + create a restart file before the main event run
    spinup_days: 1               # days of constant bankfull forcing to reach steady river state
    dthisout_s: 3600              # obs-point output interval during spinup (s) — for validation plot
    dtmapout_s: 3600              # map snapshot interval during spinup (s) — controls animation frame count

  sanity_checks:
    min_inundation_depth_m: 0.0  # threshold for counting a cell as flooded in sanity checks
    animation_fps: 1             # frames per second for flood progression animation

# Flood metrics (rule 17)
metrics:
  hmin: 0.05                     # min depth (m) for a pixel to count as flooded
  urban_landuse_code: 50         # landuse code for urban areas in the landuse raster (used for urban flood metrics)
