data_catalogue: ./config/data_catalogue.yml
scenarios_file: ./config/scenarios.yml
adaptation:
  strategies_file: ./config/adaptation_strategies.yml
  measures_file: ./config/measures.yml
  lines:                       # river-mouth closures of rule 12c build_adaptation_lines
    direction_length_m: 300.0  # reach length (m) from the outlet used for the flow direction
    max_tilt_deg: 60.0         # max angle (deg) between closure and the across-flow direction
    max_half_length_m: 5000.0  # max closure length (m) on each side of the river centreline
    ext_cells: 2               # cells the closure extends past the bank into land
    pump_upstream_m: 200.0     # pump line starts this far (m) upstream of the closure

profiling:
  enabled: false   # set to true to write line-level timing reports next to each log file

analysis: false    # true: also write the diagnostic figures to <results_dir>/{basin_id}/figures/analysis/; false: only the core figures in figures/

# Command-line only (snakemake --config key=value), never set here:
#   target_basins: [2433835]           # default: every basin in delta_polygons
#   target_scenarios: ['default']      # default: ['default']
#   target_strategies: ['retreat_04']  # strategies or families; default: [] (no adaptation run)
#   target_method: ['pre', 'post']     # default: both

# Machine-specific paths (results_dir, raw_data_root, sfincs_exe) live in
# config/site.yml, not here; see config/site.example.yml.

# ── Domain & basin setup (rules 01-01) ───────────────────────────────────────
domain:
  delta_buffer_m: 2000   # clipping bbox buffer around the delta polygon (m)

# ── Land use (rule 05; feeds 03, 06 and, with the channel and on the model grid, 09) ─
landuse:
  source: esa_worldcover   # copernicus_lc100 (100 m, catalogue 'land_use')
                             # | esa_worldcover (10 m, catalogue
                             # 'land_use_esa_worldcover' -- build its VRT first
                             # with tools/build_esa_worldcover_vrt.py)
  # esa_worldcover only: WorldCover has no sea class, so open sea (200) is derived
  # as the water that reaches the domain border and holds an LC100 open-sea pixel,
  # with THIS basin's own river network (rule 02) buffered as a barrier so the sea
  # stops at the river mouths instead of running up every channel. Barrier width
  # per reach = max(SWORD width / 2 * factor, min_width_m). See src/landuse.py.
  water_code: 80                    # land-use class of water (ESA WorldCover and LC100): the only pixels
                                    # rule 10 samples the river water level from, and the class rule 09
                                    # gives every non-sea pixel of the river channel
  river_barrier_width_factor: 1.0
  river_barrier_min_width_m: 30.0   # floor for reaches with a missing/zero width
  sea_max_elevation_m: 3.0         # a border water body whose median FathomDEM (EGM2008) elevation is above
                                    # this is inland water, not sea: LC100 calls some wide inland riverbeds open
                                    # sea (1475442: 37 m; 1416812: 10-20 m); real sea bodies sit at 0-1.5 m
  roughness_aggregation: area_mean  # area_mean | conveyance -- how Manning's n from
                             # the (finer) land-use source is averaged onto a coarser
                             # grid. Never the dominant class's own value: a 70 m cell
                             # that is 60% water/40% built-up would take water's 0.02.
                             # conveyance = harmonic mean (equal-depth composite n,
                             # what hydromt's subgrid tables do), biased to the
                             # smoothest pixels.

# ── Shared vertical datum correction ─────────────────────────────────────────
datum_correction: # EGM2008 -> GOCO06s (DEM) or local MSL -> GOCO06s (bathymetry), surge
  mdt_load_margin_deg: 5.0       # margin (degrees) beyond domain bbox when loading MDT
  fallback_search_deg: 3.0       # +/- deg to search for a valid MDT cell if the nearest station

# ── Terrain / bathymetry merge (rule 06) ────────────────────────────────────
terrain:
  # GEBCO is kept between gebco_max_depth_m and gebco_min_depth_m BELOW local
  # mean sea level (MSL = the MDT surface in the model's GOCO06s frame).
  gebco_max_depth_m: 10.0 # deepest: SFINCS's internal time step is set by
                          # a CFL condition (dt ~ dx/sqrt(g*h)) and shared by
                          # the WHOLE domain via its single deepest active
                          # cell.
  gebco_min_depth_m: 2.0  # shallowest, sea cells only (land use 200): GEBCO's too-shallow /
                          # above-sea-level artefacts would otherwise sit as dry "land" in the
                          # sea. Also the bed of every sea-connected creek and estuary GEBCO
                          # cannot resolve: they come out exactly this deep.
  coast_blend_m: 300.0    # width (m) of the band seaward of the coastline in which the bed is
                          # interpolated linearly from the nearest FathomDEM elevation (at the
                          # coast) to GEBCO (at this distance); 0 = hard merge, no blend. Open
                          # water only: sea narrower than twice this width (creeks, estuaries)
                          # is not blended, so it keeps its full gebco_min_depth_m.

# ── Existing flood-protection levels (rule 03) ───────────────────────────────
flopros_range:
  default_rp_yr: 2.0    # fallback assumed protection RP when neither Riverine nor Coastal are given
  max_rp_yr: 1000.0     # cap on the (FLOPROS) protection RP before discharge/

# ── River network processing (rules 02, 08, 10, 11) ──────────────────────
river_processing:
  channel_manning_n: 0.03           # channel Manning n: GVF solve (rule 11), roughness inside the river channel (rule 09), steady GVF of the upstream boundary check (analysis/check_upstream_boundary.py)
  flow_accumulation:
    discharge_variable: bankfull_discharge_m3s
  width_qa:  # rule 08 (and 07): SWORD width checks
    max_width_fill_m: 30.0          # SWORD max_width fill value: never swapped into width (Waal: 389 m width, 30 m max_width)
  canal_routing:  # rule 08/11 discharge accumulation: canals get no share at a bifurcation
    auto: true                      # arm excluded if it, or its chain to the next junction, is a SWORD canal (lakeflag 2) and a sibling arm is not (see src.river_network.canal_excluded_arms)
    force_exclude:                  # reach ids always excluded when they are a bifurcation arm
      - 23261000641                 # 1248635: Amsterdam-Rijnkanaal leaving the Waal at Tiel (not canal-flagged in SWORD)
    force_include: []               # reach ids never excluded by the automatic rule
  water_surface:  # rule 10: river water surface from FathomDEM and its slope (src/water_surface.py); conditions the DEM channels, sets the zsini river cells and the river bed's level and slope
    node_spacing_m: 500             # node spacing along each reach (rules 10 and 11 share the network)
    median_half_window_m: 1000      # median of the water centreline pixels (landuse.water_code) within this distance of each node (drops stray peaks and dips; islands are skipped)
    smoothing_m: 5000               # running-mean length of the level after the downstream-monotone fit; the mouths stay at the calm sea level
    slope_smoothing_m: 40000        # running-mean length of the surface the slope (and so the river depth) is taken from; FathomDEM's stepped surface gives near-zero slopes on its flat treads at short lengths
    mouth_level_tol_m: 0.5          # a network end is a sea mouth (pinned at calm_sea_level_m) if sea class or its FathomDEM level is within this of the sea
    water_body: {min_width_m: 1000, sea_class_fraction: 0.5}  # wide sea-class / GEBCO-floor nodes: the river bed keeps the GEBCO bathymetry there
    step_threshold_m: 0.5           # a reach-level drop larger than this at a junction is reported as a structure (weir/lock/dam), a rise as inconsistent data; both are smoothed across
    structure_min_drop_m: 0.2       # smallest drop that counts as a structure at a SWORD obstruction reach (obstr_type 1-4)
    use_sword_obstructions: true
    structures: []                  # reach ids with a structure at their downstream end (reported)
  river_depth_modelling:  # rule modelled_depth_estimation (11): river bed below rule 10's surface, then two SFINCS runs that set and verify the dike crests
    bed:  # round-0 river bed (src/river_bed.py): Manning depth at the design discharge and rule 10's slope -> bed = surface - depth
      design_discharge: bankfull    # bankfull | mean: GloFAS discharge the Manning depth is computed for, routed through the network. The depth hangs below the
                                    # mean-flow level (FathomDEM), so bankfull treats that level as the bankfull stage: bed lower by h_bankfull - h_mean than with mean
      slope_floor: 1.0e-5           # m/m, lowest slope the depth is computed at (the surface keeps its own slope); normal depth diverges on a flat surface
      width_smoothing_m: 5000       # running median then mean of SWORD node widths along the network, across reach boundaries; raw node widths give +-5 m bed jumps (4267691: 172 steps > 3 m)
      bathymetry_handover_m: 5000   # river bed blends linearly into GEBCO bathymetry (wide sea-class nodes) over this distance
      q_min_m3s: 1.0                # at or below: depth from the width-depth fit of the other nodes
    # Rounds 1-2 run ramp_hr + T_walled + calibration_margin_hr: T_walled is the slowest
    # walled (no overtopping) travel time at the calibration discharge from a forcing point to
    # its network end (src.river_profile.walled_travel_time): per node the gravity speed
    # u + sqrt(g h) where friction acts slower than the ramp, else the kinematic 5/3 u.
    calibration_margin_hr: 12       # SFINCS round 1 reached steady state up to 4 h after ramp + T_walled (2433835)
    wave_regime_rT: [0.3, 3.0]      # r * ramp_hr with r = g n^2 u / h^(4/3): below the first, inertial (gravity speed; wide, deep,
                                    # slow reaches, 1248635 Meuse ~0.15); from the first, kinematic (above the second frictional,
                                    # in between a transition taking the slower, kinematic speed; 1248635 Waal/Lek ~12)
    calibration_max_days: 4         # longer runs fail: raise it or check the bed
    steady_check: {window_hr: 3, tol_m: 0.05}  # warn when centreline cells still rise more than tol_m over the run's last window_hr
    verify_crests: false            # run round 2 (production crests, reports overtopped edges); false: round 1 only
    depth_scale: 1.0                # sensitivity only: the burned depth below rule 10's surface is multiplied by this (1.0 = the estimated bed)
    crosssections: false            # true: SFINCS cross-sections (crsfile) across each arm of every bifurcation on the seeds' widest paths, discharge in each round's sfincs_his.nc (diagnostic, src.river_depth_calibration.bifurcation_cross_sections)
    ramp_hr: 6.0                    # half-cosine river ramp, then held to the run end: every crossing from its mean discharge (the flow that holds zsini's river level, src.river_bed mean_level_m) to the calibration discharge. The sea is held at each station's storm tide at the coastal protection RP from the start (zsini of sea and channel cells no lower than it), so only the rivers change. A step to the full (often many-times-bankfull) discharge sends a front that can oscillate for the whole run.
    weir_crest_m: 1000.0            # confinement weir crest (m) for round 1 -- effectively never overtopped
    # ── weir-building params (used by modelled_depth_estimation every round)
    min_component_cells: 30           # discard small isolated land islands or water patches below this cell count on either side -- neither gets a weir ring around it
    unprotected_ocean_wetlands: false # true: wetland/lagoon patches (80 = permanent water/tidal flats, 90 = herbaceous wetland, and 95 = mangroves under ESA WorldCover; src.landuse.OCEAN_WETLAND_CLASSES) sharing a cell edge with the open sea are left on the SEAWARD side of the coastal dike -- the dike runs along their landward edge and they flood freely (still counted as land in flood metrics). false: the dike follows the open-sea (200) boundary.
    weir_par1: 0.6                    # SFINCS weir discharge coefficient Cd (0.6 = SFINCS's own recommended value). Per metre of weir, with h1/h2 = water level above crest on the high/low side: free flow q = Cd * 1.7049 * h1^1.5 (1.7049 = (2/3)^1.5 * sqrt(g)); submerged (h2 > 2/3 h1) q = Cd * h2 * sqrt(2g (h1 - h2)). No flow while both sides are below the crest. Scales overtopping discharge directly; lower = more throttled flow for the same exceedance
    freeboard_m: 0.0                  # margin added on top of every production weir crest: crest(edge) = max(round-1 water level on the edge's own water side, coastal protection crest) + freeboard_m, rounded UP to the next centimetre (src.surge.ceil_crest). The only margin -- round 1 is still confined by 1000 m walls, so its water level already holds the calibration discharge exactly (the round-up adds 0-0.1 m on top).

# ── Boundary forcings (rule 07d) ─────────────────────────────────────────────
boundary_forcings:
  lead_days: 2
  dt_hr: 1
  surge:
    min_stations: 6
    max_stations: 10
    dedupe_radius_km: 1
    search_radii_km: [10, 25, 50, 1000]
    period_hr: 12
    hydrograph: # storm-tide hydrographs (HGRAPHER, Dullaart et al. 2023) from the hourly GTSM reanalysis,
      # built per basin at its own surge stations (rules select_surge_stations ->
      # extract_gtsm_series -> storm_tide_hydrographs, src/storm_tide_hydrograph.py). When enabled,
      # every surge scenario uses average tide + surge peaking on tidal high water ("Tide": tide
      # only) over -window_hr..+window_hr; the window starts right after the lead-in (lead_days)
      # and the river peak is aligned with the surge peak. Disabled: an RP falls back to a
      # half-cosine of period_hr after the lead-in, and surge_rp_yr "Tide" is unavailable.
      enabled: true
      window_hr: 60          # event = -60..+60 h around the peak -> 120 h event window; also the length of the surge shapes
      window_overrides_hr:   # optional per-basin window (h), keyed by basin id -- surges last hours on
        2433835: 168         # some coasts and days on others. Changing a basin's window reruns its
                             # storm_tide_hydrographs and rule 07d onward, not the GTSM extraction.
      # KGL: Changed from 70 to 168 to ensure the whole falling limb is included in the timerseires

      ramp_hr: 6.0        # boundary blends from the calm lead-in level into the tide over the window's first hours (surge is still 0 there)
      max_match_km: 0.1      # coincidence tolerance: COAST-RP's coastal stations ARE GTSM output stations
      # One surge shape per return period, from the historic events whose peak is close to what
      # that return period needs:
      match_on: surge        # surge: event surge peak vs (return level - average high water)
                             # | water_level: event peak total water level vs the return level
      match_window_m: 0.05   # events within +-this of the target are used ...
      min_events: 10         # ... or the min_events nearest if fewer; a target above every recorded
                             # peak takes the min_events largest events
    slr: # IPCC AR6 sea-level-rise fingerprint. `enabled` gates whether the AR6 slr_data catalogue is even fetched/computed (rule get_boundary_forcings) -- the actual target global-mean SLR (slr_m) is NOT here: it's per-scenario in config/scenarios.yml (see scenario_params in 00_common.smk), applied at scenario-build time (rule build_sfincs) against each station's slr_fingerprint, so changing one scenario's slr_m only reruns that scenario's build + event run, never the basin-level weir/depth calibration, skeleton build, or any OTHER scenario. See src.surge.apply_slr_fingerprint / build_design_surge_matrix.
      enabled: true
      ssp_scenario: ssp245
      confidence_level: medium   # "medium" or "low"
      year: 2100
      quantile: 0.5
      fallback_search_deg: 3.0   # +/- deg to search for a valid AR6 location if the nearest is NaN
  river:
    period_hr: 24 # length (h) of the synthetic river wave; its centre is the river peak hour in every mode
    event_hydrograph: # how a scenario's river return period becomes a hydrograph (rule build_sfincs)
      source: glofas_event   # glofas_event: the REAL GloFAS flood of the basin's main inflow whose peak is
                             #   nearest the return level, scaled to it; every other inflow carries its own
                             #   discharge on the same dates (same scale factor)
                             # | cosine: synthetic wave of period_hr on the mean discharge
      separation_days: 14    # independent flood peaks are at least this far apart
      n_largest: 5           # a return level above every recorded peak uses the average of the n_largest
                             # events, each scaled to it
      max_rising_days: 7     # the rising limb starts at the main inflow's lowest daily flow within this many
                             # days before the peak; in storm-tide mode the forcing window makes room for it
                             # (both peaks move later, the surge holds the calm level until its window)
      # The event run starts at the spin-up's mean discharge; where the rising-limb start is off the
      # mean, the discharge blends from the mean into the event (half-cosine) over a ramp ending there of
      #   max(min_ramp_hr, pi/2 x gap / (max_rise_per_hr x peak))   with gap = |rising-limb start discharge - mean|
      min_ramp_hr: 6.0    # shortest ramp (h)
      max_rise_per_hr: 0.02  # the blend's steepest rise, as a share of the main inflow's peak per hour
                             # (0.02 -> a gap of 50 % of the peak takes 39 h). Relative, so it suits
                             # small and large rivers alike; real floods rise at ~0.01 of the 100-yr peak per hour
    glofas_buffer_deg: 1.0
    glofas_search_radius_km: 5.0    # radius around inside-domain reach centroid to search for GloFAS cells
    glofas_min_mean_discharge_m3s: 10.0  # minimum mean discharge (m³/s) for a GloFAS cell to be considered

    eva:  # Extreme value analysis on GloFAS discharge -- river-only
      preview_rp_yr: 100.0          # diagnostic-only preview return period (yr) for rule get_boundary_forcings' own q_rp100/CI/plot-vertical-line and the has_glofas "ok" gate -- a fixed, basin-level constant, NOT derived from any requested scenario's own river_rp_yr (a scenario-derived value here previously made this basin-level rule's own output -- and therefore everything downstream, including the expensive depth calibration -- rerun on every scenario switch, and even made has_glofas itself vary depending on which scenario happened to be requested first). The actual production discharge_rp_table (rules 08/11/14) is always computed at every standard RP regardless of this value.
      bankfull_rp_yr: 1.5            # return period for bankfull discharge (yr, AMAX/GEV fit)
      ci_alpha: 0.95
      n_boot: 200               # bootstrap resamples for the q_rp2/q_rp100 confidence intervals
      threshold_start_pct: 90.0
      threshold_step_pct: 1.0
      threshold_min_pct: 50.0   # floor: never drop below this percentile
      threshold_max_pct: 99.5
      threshold_max_iter: 30    # enough to traverse 50→99.5 % at 1 % steps
      peaks_per_year_min: 1.0
      peaks_per_year_max: 5
      min_years_high_confidence: 40
      min_days: 9131       # minimum valid days to attempt EVA (≈25 yr)
      decorr_cut: 0.368    # autocorrelation cutoff (≈1/e) for decorrelation window
      decorr_max: 30       # maximum decorrelation lag to search (days)
      deseasonalize_for_decorr: true  # subtract the day-of-year mean before estimating the declustering lag (POT and fits use the raw series)
      fit_method: Lmoments

    bias_correction: # GRDC bias correction of GloFAS
      enabled: false            # set to false to disable GRDC bias correction globally
      # The GloFAS-vs-GRDC correlation diagnostic (compute_grdc_correlation)
      # runs only with `enabled: true`; bias_correct_discharge returns before
      # it otherwise.
      grdc_search_radius_km: 15.0  # radius around inside-domain reach centroid to search
                                    # for a nearby GRDC gauge station (gauges are sparse,
                                    # hence a larger radius than glofas_search_radius_km)
      min_overlap_days: 730    # minimum overlapping valid days (GloFAS & GRDC) required
                                # to attempt empirical quantile mapping (~2 yr); else skipped
      tail_percentile: 90.0    # the headline GloFAS-vs-GRDC correlation is restricted to overlap days where
                                # GRDC discharge is at or above this percentile.

# ── Upstream-boundary check (analysis/check_upstream_boundary.py) ───────────────────────────────────────────
testing: # Diagnostic-only side branch
  upstream_boundary_check:
    amplitude_threshold_fraction: 0.05   # sea influence ends where the steady level rise falls
                                          # below max(level_tol_m, this x A0), A0 = SWL_ext - calm
                                          # at the mouth. SWL_ext: per station the highest
                                          # storm tide + SLR x fingerprint over the scenarios in
                                          # scenarios.yml with a surge RP and the stress case below
    stress_surge_rp_yr: 100               # stress case storm-tide return period (yr); a COAST-RP
                                          # tabulated value: 1,2,5,10,25,50,100,250,500,1000
    stress_slr_m: 1.0                     # stress case SLR (x slr_fingerprint)
    level_tol_m: 0.05                     # largest level rise allowed at the forcing point
    margin_km: 5                          # forcing point at least this far upstream of the influence
                                          # end; steady SFINCS put that end up to 2.9 km beyond
                                          # the GVF estimate in three benchmark basins
                                          # (figs/upstream_boundary_benchmark/README.md)
    high_gradient_elevation_m: 10         # DE2's rule of thumb, reported for comparison: river
                                          # level at the forcing point this far above local MSL

# ── SFINCS model build & run (rules 12-15) ─────────────────────────────
sfincs:
  boundary_setup: # rule 14
    water_level_buffer_m: 25000   # search radius for matching surge boundary stations to the
                                  # nearest water-level boundary cell (m)
    outflow_buffer_m: 500.0      # buffer radius (m) around each delta-outline outflow point
    # mode/river_rp_yr/surge_rp_yr are no longer set here --
    # derived per-scenario from config/scenarios.yml (see scenario_params in
    # 00_common.smk): both RPs set -> compound; exactly one set -> that
    # driver alone (river_only/coastal_only); both null -> invalid.
    flat_boundary_point_spacing_m: 5000   # boundary-point spacing along the water-level mask, used only when mode="river_only"
    compound:
      lag_hr: 0 # Shifts the river discharge timeseries relative to the surge timeseries (> 0 delays the river)
      lag_overrides_hr: {}  # per basin id, from analysis/peak_lag.py: the shift that makes the river and
                            # surge peaks reach the main mouth together (coast and river runs of one RP/SLR)
    slr_ramp_hr: 24  # the spin-up is shared by all scenarios and has the spin-up scenario's SLR, so a
                        # scenario with another slr_m would otherwise hit the restart as a step at the event
                        # start (a 0.34 m step overtopped ~1670 of 1789 coastal weir segments in basin
                        # 2433835 within the first hour). The SLR term instead goes linearly from the
                        # spin-up's to the scenario's over this many hours after the event start; must
                        # end before the surge/river peak.
                        # 0 = old behaviour (step). A param of rule 14 only: changing it rebuilds
                        # the scenarios, never rule 07d or the spin-up.
  grid:
    resolution_m: 100            # main-grid cell size dx (m) for every basin. The subgrid pixel is
                                 # dx / subgrid.nr_subgrid_pixels (10 m at the defaults); channels
                                 # narrower than a cell are carried by the subgrid tables.
    resolution_overrides_m:      # optional per-basin dx (m), keyed by basin id -- e.g. to keep a
      4267691: 150               # very large delta within the memory of the machine it is built on
    active_mask:  # rules 11 and 12a: exclude cells far above anything the river itself ever reaches
      enabled: true
      elevation_buffer_m: 20.0  # active-cell elevation ceiling = river_elevation_max.json's own
                                 # river_elevation_max_m (rule river_surface, 10, max conditioned centerline
                                 # elevation, always attained at a seed reach) + this buffer
  subgrid:                       # always built -- the model relies on it for channels narrower than a cell
    nr_subgrid_pixels: 10        # subgrid pixels per grid cell (must be multiple of 2)
    nr_levels: 20                 # water-level bins for subgrid tables; memory scales linearly with this (default: 20)
    nrmax: 2000                  # tile size for subgrid computation (default 2000)
  observation_points:
    n_top_crossings: 2           # number of highest-Q boundary crossings to trace downstream
    n_per_crossing: 5            # observation points placed per crossing
    max_downstream_hops: 200     # river-network traversal limit per crossing
    mouth_upstream_m: 1000       # an obs point and a cross-section (crsfile) at every river mouth (rule 10's
                                 # is_mouth nodes), this far upstream of it along its reach, for the peak lag
    mouth_section_margin_m: 150  # cross-section length beyond each bank (m)

  simulation: # Main EVENT model config
    tref: "2000-01-01 00:00:00"  # reference datetime; forcing timeseries are in "hours since tref"
    dtmapout:     3600           # spatial map output interval (s) -- MAIN EVENT run only
    dtmaxout:     3600           # max-value envelope output interval (s)
    dthisout:      600           # time-series output at observation points (s) -- MAIN EVENT run only
    storevelmax:     0           # write maximum flow velocity (0=off, 1=on)
    storetwet:       0           # write inundation duration / time-wet (0=off, 1=on)
    # SFINCS executable: sfincs_exe in config/site.yml (see config/site.example.yml)
    timeout_s: 68400             # max wall-clock time for a SFINCS subprocess (s, 19 h) --
                                  # shared by both the spin-up and main event runs
  spinup: # Spin-up simulation with constant forcings
    enabled: true                # run a spin-up + create a restart file before the main event run
    spinup_days: 2               # days of constant mean-discharge forcing to reach steady river state; also
                                 # the forcing lead-in (boundary_forcings.lead_days must equal it)
    spinup_overrides_days: {}    # per basin id: spin-up length, and so that basin's forcing lead-in (days)
    scenario: mean_03SLR         # mean-conditions scenario of the spin-up: mean discharge, sea held at the calm
                                 # level + its slr_m x fingerprint (tide-averaged); every event restarts from it
    boundary_ramp_hr: 6.0     # the spin-up sea is held at each station's calm-sea level (the event lead-in's own level; the river stays at its mean discharge); the boundary ramps linearly from the sea's starting level (rounded basin mean) to those station levels over this many hours -- normally identical, but a step at the boundary sends a front in that can overtop the coastal dike (basin 2433835: a 0.30 m step gave up to +1.1 m at a 0.40 m crest)
    dthisout_s: 3600              # obs-point output interval during spinup (s) — for validation plot
    dtmapout_s: 3600              # map snapshot interval during spinup (s) — controls animation frame count

  sanity_checks:
    min_inundation_depth_m: 0.0  # threshold for counting a cell as flooded in sanity checks
    animation_fps: 1             # frames per second for flood progression animation

# Flood metrics (rule 16)
metrics:
  hmin: 0.05                     # min depth (m) for a pixel to count as flooded
  urban_landuse_code: 50         # landuse code for urban areas in the landuse raster (used for urban flood metrics)

