data_catalogue: ./config/data_catalogue.yml
scenarios_file: ./config/scenarios.yml
adaptation:
  strategies_file: ./config/adaptation_strategies.yml
  measures_file: ./config/measures.yml

profiling:
  enabled: false   # set to true to write line-level timing reports next to each log file

# Machine-specific paths are NOT set in this file -- they come from three
# environment variables (read in workflow/rules/00_common.smk). Set them once
# in PowerShell, then restart your terminal (see CONTRIBUTING.md "Local
# machine paths"):
#   [Environment]::SetEnvironmentVariable("GCFM_RESULTS_DIR", "D:\your\results\path", "User")    # -> results_dir
#   [Environment]::SetEnvironmentVariable("GCFM_RAW_DATA_ROOT", "D:\your\raw_data\path", "User") # -> data catalogue root
#   [Environment]::SetEnvironmentVariable("GCFM_SFINCS_EXE", "C:\path\to\sfincs.exe", "User")    # -> SFINCS executable

# ── Domain & basin setup (rules 01-02) ───────────────────────────────────────
domain:
  delta_buffer_m: 2000   # clipping bbox buffer around the delta polygon (m)

# ── Land use (rule 02b; feeds 03/04/05b/05c and, on the model grid, 09b) ─────
landuse:
  source: esa_worldcover   # copernicus_lc100 (100 m, catalogue 'land_use')
                             # | esa_worldcover (10 m, catalogue
                             # 'land_use_esa_worldcover' -- build its VRT first
                             # with tools/build_esa_worldcover_vrt.py)
  # esa_worldcover only: WorldCover has no sea class, so open sea (200) is derived
  # as the water that reaches the domain border and holds an LC100 open-sea pixel,
  # with THIS basin's own river network (rule 06) buffered as a barrier so the sea
  # stops at the river mouths instead of running up every channel. Barrier width
  # per reach = max(SWORD width / 2 * factor, min_width_m). See src/landuse.py.
  river_barrier_width_factor: 1.0
  river_barrier_min_width_m: 30.0   # floor for reaches with a missing/zero width
  roughness_aggregation: area_mean  # area_mean | conveyance -- how Manning's n from
                             # the (finer) land-use source is averaged onto a coarser
                             # grid. Never the dominant class's own value: a 70 m cell
                             # that is 60% water/40% built-up would take water's 0.02.
                             # conveyance = harmonic mean (equal-depth composite n,
                             # what hydromt's subgrid tables do), biased to the
                             # smoothest pixels.

# ── Shared vertical datum correction ─────────────────────────────────────────
datum_correction: # EGM2008 -> GOCO06s (DEM) or local MSL -> GOCO06s (bathymetry), surge
  mdt_load_margin_deg: 5.0       # margin (degrees) beyond domain bbox when loading MDT
  fallback_search_deg: 3.0       # +/- deg to search for a valid MDT cell if the nearest station

# ── Terrain / bathymetry merge (rule 05a) ────────────────────────────────────
terrain:
  # GEBCO is kept between gebco_max_depth_m and gebco_min_depth_m BELOW local
  # mean sea level (MSL = the MDT surface in the model's GOCO06s frame).
  gebco_max_depth_m: 10.0 # deepest: SFINCS's internal time step is set by
                          # a CFL condition (dt ~ dx/sqrt(g*h)) and shared by
                          # the WHOLE domain via its single deepest active
                          # cell.
  gebco_min_depth_m: 2.0  # shallowest, sea cells only (land use 200): GEBCO's too-shallow /
                          # above-sea-level artefacts would otherwise sit as dry "land" in the
                          # sea. Also the bed of every sea-connected creek and estuary GEBCO
                          # cannot resolve: they come out exactly this deep.
  coast_blend_m: 300.0    # width (m) of the band seaward of the coastline in which the bed is
                          # interpolated linearly from the nearest FathomDEM elevation (at the
                          # coast) to GEBCO (at this distance); 0 = hard merge, no blend. Open
                          # water only: sea narrower than twice this width (creeks, estuaries)
                          # is not blended, so it keeps its full gebco_min_depth_m.

# ── Existing flood-protection levels (rule 04) ───────────────────────────────
flopros_range:
  default_rp_yr: 2.0    # fallback assumed protection RP when neither Riverine nor Coastal are given
  max_rp_yr: 1000.0     # cap on the (FLOPROS) protection RP before discharge/

# ── River network processing (rules 06, 08, 09, 10) ──────────────────────────
river_processing:
  flow_accumulation:
    discharge_variable: bankfull_discharge
    iterations: 100
  river_depth_modelling:  # rule modelled_depth_estimation (10): SFINCS runs that set river depth and dike crests
    calibration_days: 1             # single fixed run duration (days)
    discharge_ramp_hours: 6.0        # linear ramp from each crossing's own bankfull_discharge up to the full calibration discharge over this many hours (from t=0), then held flat for the rest of the run -- avoids forcing the full (often many-times-bankfull) calibration discharge as an instantaneous step into an initially near-dry channel, which produces a startup shock wave that can persist/oscillate for the whole run instead of damping out. Mirrors production's own bankfull-lead-in-then-ramp hydrograph shape (src.river_forcing.build_design_discharge_matrix/sinusoidal_wave, rule 13/14's own spin-up), just linear instead of sinusoidal since calibration only needs to reach and hold the peak, not simulate a full event recession.
    weir_crest_m: 1000.0            # confinement weir crest (m) for rounds 0 and 1 -- effectively never overtopped
    excavation_fraction: 0.8        # fraction of round 0's confined rise above the DEM (period_max_zs - dem_at_cell, per centerline cell) excavated as channel depth (rivdph). The mouth rules in 10_depth_estimation_modelled.py (coastal endpoint at natural bathymetry, bed floored upstream of it) are applied on top.
    # ── weir-building params (used by modelled_depth_estimation every round)
    min_component_cells: 30           # discard small isolated land islands or water patches below this cell count on either side -- neither gets a weir ring around it
    unprotected_ocean_wetlands: false # true: wetland/lagoon patches (80 = permanent water/tidal flats, 90 = herbaceous wetland, and 95 = mangroves under ESA WorldCover; src.landuse.OCEAN_WETLAND_CLASSES) sharing a cell edge with the open sea are left on the SEAWARD side of the coastal dike -- the dike runs along their landward edge and they flood freely (still counted as land in flood metrics). false: the dike follows the open-sea (200) boundary.
    weir_par1: 0.6                    # SFINCS weir discharge coefficient Cd (0.6 = SFINCS's own recommended value). Per metre of weir, with h1/h2 = water level above crest on the high/low side: free flow q = Cd * 1.7049 * h1^1.5 (1.7049 = (2/3)^1.5 * sqrt(g)); submerged (h2 > 2/3 h1) q = Cd * h2 * sqrt(2g (h1 - h2)). No flow while both sides are below the crest. Scales overtopping discharge directly; lower = more throttled flow for the same exceedance
    freeboard_m: 0.0                  # margin added on top of every production weir crest: crest(edge) = max(round-1 water level on the edge's own water side, coastal protection crest) + freeboard_m, rounded UP to the next 0.1 m. The only margin -- round 1 is still confined by 1000 m walls, so its water level already holds the calibration discharge exactly (the round-up adds 0-0.1 m on top).

# ── Boundary forcings (rule 07) ─────────────────────────────────────────────
boundary_forcings:
  lead_days: 1
  dt_hr: 1
  surge:
    min_stations: 6
    max_stations: 10
    dedupe_radius_km: 1
    search_radii_km: [10, 25, 50, 1000]
    period_hr: 12
    hydrograph: # storm-tide hydrographs (HGRAPHER, Dullaart et al. 2023) from the hourly GTSM reanalysis,
      # built per basin at its own surge stations (rules select_surge_stations ->
      # extract_gtsm_series -> storm_tide_hydrographs, src/storm_tide_hydrograph.py). When enabled,
      # every surge scenario uses average tide + surge peaking on tidal high water ("Tide": tide
      # only) over -window_hr..+window_hr; the window starts right after the lead-in (lead_days)
      # and the river peak is aligned with the surge peak. Disabled: an RP falls back to a
      # half-cosine of period_hr after the lead-in, and surge_rp "Tide" is unavailable.
      enabled: true
      window_hr: 60          # event = -60..+60 h around the peak -> 120 h event window; also the length of the surge shapes
      window_overrides_hr:   # optional per-basin window (h), keyed by basin id -- surges last hours on
        2433835: 70          # some coasts and days on others. Changing a basin's window reruns its
                             # storm_tide_hydrographs and rule 07 onward, not the GTSM extraction.
      ramp_hours: 6.0        # boundary blends from the calm lead-in level into the tide over the window's first hours (surge is still 0 there)
      max_match_km: 0.1      # coincidence tolerance: COAST-RP's coastal stations ARE GTSM output stations
      # One surge shape per return period, from the historic events whose peak is close to what
      # that return period needs:
      match_on: surge        # surge: event surge peak vs (return level - average high water)
                             # | water_level: event peak total water level vs the return level
      match_window_m: 0.05   # events within +-this of the target are used ...
      min_events: 10         # ... or the min_events nearest if fewer; a target above every recorded
                             # peak takes the min_events largest events
    slr: # IPCC AR6 sea-level-rise fingerprint. `enabled` gates whether the AR6 slr_data catalogue is even fetched/computed (rule get_boundary_forcings) -- the actual target global-mean SLR (slr_m) is NOT here: it's per-scenario in config/scenarios.yml (see scenario_params in 00_common.smk), applied at scenario-build time (rule build_sfincs) against each station's slr_fingerprint, so changing one scenario's slr_m only reruns that scenario's build + event run, never the basin-level weir/depth calibration, skeleton build, or any OTHER scenario. See src.surge.apply_slr_fingerprint / build_design_surge_matrix.
      enabled: true
      ssp_scenario: ssp245
      confidence_level: medium   # "medium" or "low"
      year: 2100
      quantile: 0.5
      fallback_search_deg: 3.0   # +/- deg to search for a valid AR6 location if the nearest is NaN
  river:
    period_hr: 24 # length (h) of the synthetic river wave; its centre is the river peak hour in every mode
    event_hydrograph: # how a scenario's river return period becomes a hydrograph (rule build_sfincs)
      source: glofas_event   # glofas_event: the REAL GloFAS flood of the basin's main inflow whose peak is
                             #   nearest the return level, scaled to it; every other inflow carries its own
                             #   discharge on the same dates (same scale factor)
                             # | cosine: synthetic wave of period_hr on the mean discharge
      separation_days: 14    # independent flood peaks are at least this far apart
      n_largest: 5           # a return level above every recorded peak uses the average of the n_largest
                             # events, each scaled to it
      # The event run starts at the spin-up's mean discharge, while a real flood is already well
      # above it at that point: the discharge blends from the mean into the event over a ramp of
      #   max(min_ramp_hours, gap / (max_rise_per_hr x peak))   with gap = event start discharge - mean
      min_ramp_hours: 6.0    # shortest ramp (h)
      max_rise_per_hr: 0.05  # the main inflow closes the gap by at most this share of its own peak per
                             # hour (0.05 -> a gap of 60 % of the peak takes 12 h). Relative, so it suits
                             # small and large rivers alike; real floods rise at ~0.01 of the 100-yr peak per hour
    glofas_buffer_deg: 1.0
    glofas_search_radius_km: 5.0    # radius around inside-domain reach centroid to search for GloFAS cells
    glofas_min_mean_discharge: 10.0  # minimum mean discharge (m³/s) for a GloFAS cell to be considered

    eva:  # Extreme value analysis on GloFAS discharge -- river-only
      rp_fl: 100.0          # diagnostic-only preview return period (yr) for rule get_boundary_forcings' own q_rp100/CI/plot-vertical-line and the has_glofas "ok" gate -- a fixed, basin-level constant, NOT derived from any requested scenario's own river_rp (a scenario-derived value here previously made this basin-level rule's own output -- and therefore everything downstream, including the expensive depth calibration -- rerun on every scenario switch, and even made has_glofas itself vary depending on which scenario happened to be requested first). The actual production discharge_rp_table (rules 08/10/13) is always computed at every standard RP regardless of this value.
      rp_bf: 1.5            # return period for bankfull discharge (yr, AMAX/GEV fit)
      ci_alpha: 0.95
      threshold_start_pct: 90.0
      threshold_step_pct: 1.0
      threshold_min_pct: 50.0   # floor: never drop below this percentile
      threshold_max_pct: 99.5
      threshold_max_iter: 30    # enough to traverse 50→99.5 % at 1 % steps
      peaks_per_year_min: 1.0
      peaks_per_year_max: 5
      min_years_high_confidence: 40
      min_days: 9131       # minimum valid days to attempt EVA (≈25 yr)
      decorr_cut: 0.368    # autocorrelation cutoff (≈1/e) for decorrelation window
      decorr_max: 30       # maximum decorrelation lag to search (days)
      fit_method: Lmoments

    bias_correction: # GRDC bias correction of GloFAS
      enabled: false            # set to false to disable GRDC bias correction globally
      # Also used whenever GRDC is consulted at all, not just when the
      # correction itself is applied: the raw GloFAS-vs-GRDC correlation
      # diagnostic (compute_grdc_correlation) runs unconditionally,
      # independent of `enabled` -- see src.extreme_values module docstring.
      grdc_search_radius_km: 15.0  # radius around inside-domain reach centroid to search
                                    # for a nearby GRDC gauge station (gauges are sparse,
                                    # hence a larger radius than glofas_search_radius_km)
      min_overlap_days: 730    # minimum overlapping valid days (GloFAS & GRDC) required
                                # to attempt empirical quantile mapping (~2 yr); else skipped
      tail_percentile: 90.0    # the headline GloFAS-vs-GRDC correlation is restricted to overlap days where
                                # GRDC discharge is at or above this percentile.

# ── Testing / validation (rule 11) ───────────────────────────────────────────
testing: # Diagnostic-only side branch
  upstream_boundary_check:
    effective_period_fraction: 0.5   # fraction of surge period_hr used as effective tidal period
    channel_manning_n: 0.030            # assumed channel roughness
    amplitude_threshold_fraction: 0.05   # march upstream until amplitude decays
                                          # below this fraction of its LOCAL
                                          # (per-mouth) starting value
    surge_rp: 100                        # surge return period (yr) used as the per-mouth wave
                                          # amplitude (A0) for this check -- independent of any
                                          # scenario's own design RP. Must be a COAST-RP tabulated
                                          # value: 1,2,5,10,25,50,100,250,500,1000.

# ── SFINCS model build & run (rules 13, 14, 15) ─────────────────────────────
sfincs:
  boundary_setup: # rule 13
    waterlevel_buffer_m: 25000   # search radius for matching surge boundary stations to the
                                  # nearest waterlevel boundary cell (m)
    outflow_buffer_m: 500.0      # buffer radius (m) around each delta-outline outflow point
    # mode/design_rp_river_yr/design_rp_surge_yr are no longer set here --
    # derived per-scenario from config/scenarios.yml (see scenario_params in
    # 00_common.smk): both RPs set -> compound; exactly one set -> that
    # driver alone (river_only/coastal_only); both null -> invalid.
    flat_boundary_point_spacing_m: 5000   # boundary-point spacing along the waterlevel mask, used only when mode="river_only"
    compound:
      lag_hr: 0 # Shifts the river discharge timeseries relative to the surge timeseries
  grid:
    resolution_m: 100            # main-grid cell size dx (m) for every basin. The subgrid pixel is
                                 # dx / subgrid.nr_subgrid_pixels (10 m at the defaults); channels
                                 # narrower than a cell are carried by the subgrid tables.
    resolution_overrides_m:      # optional per-basin dx (m), keyed by basin id -- e.g. to keep a
      4267691: 150               # very large delta within the memory of the machine it is built on
    rotated: true                # true: fit the grid to the minimum ROTATED rectangle around the delta
                                 # polygon (fewer inactive cells for elongated, oblique deltas); false:
                                 # axis-aligned (north-up) grid. Fitted once in rule 02 (see src/grid.py);
                                 # changing it reruns a basin from rule 02 onward. Only the MODEL grid
                                 # rotates: the preprocessing rasters (elevation, land use, roughness)
                                 # stay north-up, clipped to the bbox around the rotated rectangle.
                                 # Validated on basin 620947 only; the adaptation rules (18a/b/c) have
                                 # not been run on a rotated grid yet -- see CHANGELOG.md 2026-10-09.
    rotated_overrides: {}        # optional per-basin choice, keyed by basin id, e.g. {4267691: false}
    active_mask:  # rule modelled_depth_estimation (10)/13: exclude cells far above anything the river itself ever reaches
      enabled: true
      elevation_buffer_m: 20.0  # active-cell elevation ceiling = river_elevation_max.json's own
                                 # river_elevation_max_m (rule enforce_river_monotonicity, 09, max conditioned centerline
                                 # elevation, always attained at a seed reach) + this buffer
  subgrid:                       # always built -- the model relies on it for channels narrower than a cell
    nr_subgrid_pixels: 10        # subgrid pixels per grid cell (must be multiple of 2)
    nr_levels: 20                 # water-level bins for subgrid tables; memory scales linearly with this (default: 20)
    nrmax: 2000                  # tile size for subgrid computation (default 2000)
  observation_points:
    n_top_crossings: 2           # number of highest-Q boundary crossings to trace downstream
    n_per_crossing: 5            # observation points placed per crossing
    max_downstream_hops: 200     # river-network traversal limit per crossing

  simulation: # Main EVENT model config
    tref: "2000-01-01 00:00:00"  # reference datetime; forcing timeseries are in "hours since tref"
    dtmapout:     3600           # spatial map output interval (s) -- MAIN EVENT run only
    dtmaxout:     3600           # max-value envelope output interval (s)
    dthisout:      600           # time-series output at observation points (s) -- MAIN EVENT run only
    storevelmax:     0           # write maximum flow velocity (0=off, 1=on)
    storetwet:       0           # write inundation duration / time-wet (0=off, 1=on)
    # SFINCS executable: set via the GCFM_SFINCS_EXE environment variable (see top of this file)
    timeout_s: 68400             # max wall-clock time for a SFINCS subprocess (s, 19 h) --
                                  # shared by both the spin-up and main event runs
  spinup: # Spin-up simulation with constant forcings
    enabled: true                # run a spin-up + create a restart file before the main event run
    spinup_days: 1               # days of constant bankfull forcing to reach steady river state
    boundary_ramp_hours: 6.0     # the spin-up sea is held at each station's calm-sea level (the event lead-in's own level; the river stays at RP=1); the boundary ramps linearly from the sea's starting level (rounded basin mean) to those station levels over this many hours -- normally identical, but a step at the boundary sends a front in that can overtop the coastal dike (basin 2433835: a 0.30 m step gave up to +1.1 m at a 0.40 m crest)
    dthisout_s: 3600              # obs-point output interval during spinup (s) — for validation plot
    dtmapout_s: 3600              # map snapshot interval during spinup (s) — controls animation frame count

  sanity_checks:
    min_inundation_depth_m: 0.0  # threshold for counting a cell as flooded in sanity checks
    animation_fps: 1             # frames per second for flood progression animation

# Flood metrics (rule 17)
metrics:
  hmin: 0.05                     # min depth (m) for a pixel to count as flooded
  urban_landuse_code: 50         # landuse code for urban areas in the landuse raster (used for urban flood metrics)
