# Named flood-event scenarios.
# Referenced by name as the {scenario} wildcard:
#   snakemake build --config target_scenarios="['coast_100','river_100']"
# mode is derived from which RPs are set (see scenario_params in
# 00_common.smk): both set -> compound; exactly one set (the other one null)-> that driver alone
# (river_only/coastal_only); both null -> invalid (raises) -- a scenario
# needs at least one real driver, so there is no "both null" entry here.

# Surge RPs must be COAST-RP tabulated values: 1,2,5,10,25,50,100,250,500,1000.

# slr_m (required; 0.0 = no SLR): per-scenario target global-mean
# sea-level rise (m), added to each station's storm-tide level via its own
# AR6 slr_fingerprint (see scenario_params in 00_common.smk /
# src.surge.build_design_surge_matrix). Applied at scenario-build time, so
# changing one scenario's slr_m does NOT
# force every other already-built scenario to rebuild, which is what
# happened when slr_m lived as a single shared value in config.yml.

# Null = either river_rp_yr or coast_rp forcing is set to 0
# Mean = mean river discharge
# Tide = mean tidal conditions for surge (average tide from the basin's storm_tide_hydrographs.nc, same window as the storm runs)

# event (required for adaptation runs): coastal | river | compound -- selects which
# per-event scale-1 values in adaptation_strategies.yml apply to this scenario.


default:                  # what plain `snakemake build` runs (no target_scenarios given)
  surge_rp_yr: 250
  river_rp_yr: 50
  slr_m: 0.3
  event: compound

# Mean conditions: average tide, mean river, SLR -- attribution counterpart
# (00_common.smk attribution_counterparts)
mean_03SLR:
  surge_rp_yr: Tide
  river_rp_yr: Mean
  slr_m: 0.3
  event: compound

coast_only:
  surge_rp_yr: Tide
  river_rp_yr: Null # No discharge forcing
  slr_m: 0
  event: coastal

river_only:
  surge_rp_yr: Null # No surge forcing
  river_rp_yr: Mean
  slr_m: 0
  event: river

# ------------------------------------------------------------------------------------------
# Coastal flood
coast_100_03SLR:
  surge_rp_yr: 100
  river_rp_yr: Mean
  slr_m: 0.3
  event: coastal

# ----------------------------------------------------------------------------------------
# River flood
river_100_03SLR:
  surge_rp_yr: Tide
  river_rp_yr: 100
  slr_m: 0.3
  event: river

# ----------------------------------------------------------------------------------------
# Compound flood
compound_100_03SLR:
  surge_rp_yr: 100
  river_rp_yr: 100
  slr_m: 0.3
  event: compound

# Storm Gloria (Jan 2020) validation, 0.7 m surge
storm_gloria:
  surge_rp_yr: 1000 # (0.5 m)
  river_rp_yr: Mean
  slr_m: 0.2
  event: coastal
