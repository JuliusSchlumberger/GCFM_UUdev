# Named flood-event scenarios.
# Referenced by name as the {scenario} wildcard:
#   snakemake build --config target_scenarios="['coast_100','river_100']"
# mode is derived from which RPs are set (see scenario_params in
# 00_common.smk): both set -> compound; exactly one set (the other one null)-> that driver alone
# (river_only/coastal_only); both null -> invalid (raises) -- a scenario
# needs at least one real driver, so there is no "both null" entry here.

# Surge RPs must be COAST-RP tabulated values: 1,2,5,10,25,50,100,250,500,1000.

# discharge_multiplier (optional, default 1.0): per-scenario uniform scaling
# factor on the built river discharge hydrograph (see scenario_params in
# 00_common.smk / src.river_forcing.build_design_discharge_matrix). Lets a
# scenario's river driver be amplified past its raw RP lookup (e.g. when the
# raw RP500 discharge alone doesn't produce flooding) WITHOUT affecting any
# other scenario -- in particular coast_500's own small RP=2 river_rp stays
# at its raw value even though river_500/river_only_500/compound_500 below
# are amplified.

# slr_m (optional, default 0.0 = no SLR): per-scenario target global-mean
# sea-level rise (m), added to each station's storm-tide level via its own
# AR6 slr_fingerprint (see scenario_params in 00_common.smk /
# src.surge.build_design_surge_matrix). Applied at scenario-build time, same
# as discharge_multiplier above -- so changing one scenario's slr_m does NOT
# force every other already-built scenario to rebuild, which is what
# happened when slr_m lived as a single shared value in config.yml.

# Null = either river_rp or coast_rp forcing is set to 0
# Mean = mean river discharge
# Tide = mean tidal conditions for surge (based on coast-hp)

default:                  # what plain `snakemake build` runs (no target_scenarios given)
  surge_rp: 250
  river_rp: 50
  discharge_multiplier: 1.0
  slr_m: 0.5


# Attribution runs (also uses spinup for the "always flooded" class)
# Maybe only one is needed as baseline? for mean and tide for both drivers?
coast_only:
  surge_rp: Tide
  river_rp: Null # No discharge forcing
  discharge_multiplier: 1.0
  slr_m: 0

river_only:
  surge_rp: Null # No surge forcing
  river_rp: Mean
  discharge_multiplier: 1.0
  slr_m: 0


# Coastal flood
coast_100:
  surge_rp: 100
  river_rp: Mean
  discharge_multiplier: 1.0
  slr_m: 0.5

coast_only_100: # needed? because Null will mean that the dynamics change
  surge_rp: 100
  river_rp: Null # No discharge forcing
  discharge_multiplier: 1.0
  slr_m: 0.5


# River flood
river_500:
  surge_rp: Tide
  river_rp: 500
  discharge_multiplier: 1.0
  slr_m: 0

river_only_500: # needed? because Null will mean that the dynamics change
  surge_rp: Null
  river_rp: 500
  discharge_multiplier: 1.0
  slr_m: 0


# Compound
compound_100c_500r:
  surge_rp: 100
  river_rp: 500
  discharge_multiplier: 1.0
  slr_m: 0.5
