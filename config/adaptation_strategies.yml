# ACCOMMODATE

# Coast
# accommodate_04:
#   measures:
#     urban_raising: {elevation: 0.456,
#                 }

# accommodate_09:
#   measures:
#     urban_raising: {elevation: 1.026,
#                 }

# accommodate_1: # based on coast water level
#   measures:
#     urban_raising: {elevation: 1.14,
#                 }

# # River
# accommodate_04:
#   measures:
#     urban_raising: {elevation: 3.824,
#                 }

# accommodate_09:
#   measures:
#     urban_raising: {elevation: 8.604,
#                 }

# accommodate_1: # based on river WL
#   measures:
#     urban_raising: {elevation: 9.56,
#                 }


# Compound - largest scale of each driver of flood - coast in this case
# urban_raising: delta-wide DEM raise at flooded urban cells (no locations
# given -- see apply_urban_raising's own docstring), directly comparable to
# the other delta-wide strategies, unlike the earlier dike_ring (scoped to
# # one hand-drawn ring around a single location).
accommodate_04:
  measures:
    urban_raising: {elevation: 3.824}

accommodate_09:
  measures:
    urban_raising: {elevation: 8.604}

accommodate_1: # based on max WL (river or coast)
  measures:
    urban_raising: {elevation: 9.56}


# -----------------------------------------------------------------------------------------------
# RETREAT (same for river and coastal flood)
retreat_04:
  measures:
    retreat: {retreat_fraction: 0.4}
    # dep_subgrid is NOT set here -- it's auto-derived by 18a_adapt_pre.py from
    # this basin's own already-built {basin_id}/sfincs_skeleton/subgrid/dep_subgrid.tif,
    # since retreat must reuse the EXACT SAME elevation the skeleton was built
    # from (only roughness changes) -- never a separately-authored raw-data file.

retreat_09:
  measures:
    retreat: {retreat_fraction: 0.9}

retreat_1:
  measures:
    retreat: {retreat_fraction: 1.0}
