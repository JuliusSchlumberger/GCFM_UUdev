# this is the combination of measure.yml that form strategies with measures of specific scales

# config/adaptation_strategies.yml  — THE COMPOSITION (your old strategies_to_run)
# name = {strategy} wildcard.  scale = the concrete param values, specified HERE.
# method (pre/post) is chosen at the CLI and validated against measures.yml.

meta:
  root: D:/GCFM_UU/raw_data

advance:
  measures:
    offshore_island: {elevation: 2.0,
                      locations: adaptation/offshore_island.geojson }
    pumps: {discharge: 1000,
            locations: adaptation/pumps.geojson }

NbS_protect_open:
  measures:
    nbs_land_reclamation: {attenuation_rate: 0.5,
                           distance: 500,
                           locations: adaptation/land_reclamation.geojson,
                           elevation: 2.0,
                           land_use_code: 60,
                           dep_subgrid: adaptation/dep_subgrid.tif }
    water_retention: {storage_fraction: 10000,
                      locations: adaptation/water_retention.geojson,
                      dep_subgrid: adaptation/dep_subgrid.tif}

grey_protect_open:
  measures:
    coastal_and_river_levee: {elevation: 2.0,
                              locations: adaptation/levee.geojson }
    storm_surge_barrier: {elevation: 2.0,
                          locations: adaptation/storm_surge_barrier.geojson }

protect_closed:
  measures:
    coastal_levee: {elevation: 2.0,
                    locations: adaptation/levee.geojson }
    pumps:         {discharge: 1000 }

accommodate:
  measures:
    dike_ring: {elevation: 2.0,
                locations: adaptation/dike_ring.geojson }

retreat:
  measures:
    retreat: {retreat_fraction: 0.5,
              depsubgrid: adaptation/dep_subgrid.tif }
