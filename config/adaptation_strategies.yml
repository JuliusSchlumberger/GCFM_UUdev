# -----------------------------------------------------------------------------------------------
# RETREAT (same for river and coastal flood)
retreat_04:
  measures:
    retreat: {retreat_fraction: 0.4}
    # dep_subgrid is NOT set here -- it's auto-derived by 18a_adapt_pre.py from
    # this basin's own already-built {basin_id}/sfincs_skeleton/subgrid/dep_subgrid.tif,
    # since retreat must reuse the EXACT SAME elevation the skeleton was built
    # from (only roughness changes) -- never a separately-authored raw-data file.

retreat_09:
  measures:
    retreat: {retreat_fraction: 0.9}

retreat_1:
  measures:
    retreat: {retreat_fraction: 1.0}
