# The menu: What measures exist and what are their parameters?
# static definition of what measures exist and their allowed scales (never changes per run)
# Per param: min/max (null = unbounded), scale (multiplied by the strategy scale),
# type: bool (must be true/false), required_for (methods that need it).

adaptation_measures:
  # Advance
  offshore_barrier:
    params:
      elevation:
        min: 0.1
        max: 20 # in m
        scale : true
        required_for: [postprocessing, preprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the island polygon(s)
        required_for: [preprocessing]

  pumps:
    params:
      discharge:
        min: 0
        max: 100000 # in m3/s
        scale : true
        required_for: [postprocessing, preprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the pump locations
        required_for: [preprocessing]


  # NBS Protect-open
  nbs_land_reclamation:
    params:
      distance: # in metres
        min: 0
        max: 2000 # 1km - limited by the model domain
        scale : true
        required_for: [postprocessing, preprocessing]
      attenuation_rate: # depending on type of land use of offshore extension (in m/km)
        min: 0
        max: 1
        required_for: [postprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the reference coastline polyline
        required_for: [preprocessing]
      target_code:
        min: 0
        max: 200 # target ESA WorldCover class for the reclaimed land (e.g. 60 = bare/sparse vegetation)
        required_for: [preprocessing]
      min_elevation: # floor [m above datum] on the inherited coastline elevation; only used when `elevation` is not set
        min: 0
        max: 20
        required_for: [preprocessing]


  water_retention:
    params:
      storage_fraction: # fraction
        min: 0
        max: 1
        scale : true
        required_for: [postprocessing, preprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the retention area polygon(s)
        required_for: [preprocessing]

  # Greys protect-open
  river_levee:
    params:
      elevation:
        min: 0.1
        max: 20 # in m
        scale : true
        required_for: [preprocessing, postprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the levee polyline(s)
        required_for: [preprocessing]
      merge: # false: replace matched baseline weir segments, keep the rest; true: append
        min: null
        max: null
        type: bool
        required_for: []

  # storm_surge_barrier:
  #     params:
  #       sill_elevation:
  #         min: 0.1
  #         max: 20 # in m
  #         required_for: [postprocessing, preprocessing]
  #       zmin:
  #         min: null
  #         max: null # path, data source name, or GeoDataFrame with the barrier polyline(s)
  #         required_for: [preprocessing]
  #       zmax:
  #         min: null
  #         max: null # path, data source name, or GeoDataFrame with the barrier polyline(s)
  #         required_for: [preprocessing]
  #       locations:
  #         min: null
  #         max: null # path, data source name, or GeoDataFrame with the barrier polyline(s)
  #         required_for: [preprocessing]


  # Protect-closed
  coastal_levee:
    params:
      elevation:
        min: 0.1
        max: 20 # in m
        scale : true
        required_for: [postprocessing, preprocessing]
      locations:
        min: null
        max: null # path, data source name, or GeoDataFrame with the levee polyline(s)
        required_for: [preprocessing]
      merge: # false: replace matched baseline weir segments, keep the rest; true: append
        min: null
        max: null
        type: bool
        required_for: []

  # Accommodate
  # dike_ring:
  #   params:
  #     elevation:
  #       min: 0.1
  #       max: 20 # in m
  #       required_for: [postprocessing, preprocessing]
  #     locations:
  #       min: null
  #       max: null # path, data source name, or GeoDataFrame of the urban dike ring
  #       required_for: [preprocessing, postprocessing]

  urban_raising:
    params:
      raise_fraction:
        min: 0.1
        max: 1 # amount [m] added to eligible cells' own current ground elevation (additive, not an absolute target)
        scale : true
        required_for: [postprocessing, preprocessing]


  # Retreat
  retreat:
    params:
      retreat_fraction:
        min: 0
        max: 1 # fraction of population retreated from flooded areas
        scale : true
        required_for: [postprocessing, preprocessing]
